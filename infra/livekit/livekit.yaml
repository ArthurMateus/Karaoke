# LiveKit: streams a singer's live voice to the stage screen and to listeners
# (Spotlight). Phones and browsers reach it in two ways:
#  - signalling over the app's own address, /rtc (Caddy forwards it here, port 7880);
#  - the audio itself over UDP 50000-50060 (or TCP 7881 as a fallback), straight to
#    this PC's network address (LAN_IP, passed as --node-ip in docker-compose.yml).
# The API key and secret come from the LIVEKIT_KEYS environment variable.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50060
  use_external_ip: false
room:
  empty_timeout: 300
logging:
  level: info
