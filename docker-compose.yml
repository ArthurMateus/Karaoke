# Start everything:   docker compose up --build
# Then open:          http://localhost:8080   (phones: https://<LAN_IP>:8443)
# Emails (magic links) arrive at http://localhost:8025

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "8080:8080" # this PC (http://localhost counts as secure for the mic)
      - "8443:8443" # phones on your Wi-Fi (HTTPS)
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

  api:
    build: ./backend
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://karaoke:karaoke@postgres:5432/karaoke
      TEST_DATABASE_URL: postgresql+psycopg://karaoke:karaoke@postgres:5432/karaoke_test
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      EXTRA_ORIGINS: http://localhost:8080,https://localhost:8443,https://${LAN_IP:-127.0.0.1}:8443
      LIMITS_FILE: /config/limits.yaml
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Karaoke Party <no-reply@karaoke.local>}
      S3_ENDPOINT_URL: http://storage:8333
      S3_ACCESS_KEY: karaoke
      S3_SECRET_KEY: karaoke-secret
      S3_BUCKET: karaoke
      # Docker on Windows doesn't send file-change events into containers.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # Converts uploaded songs in the background (separate vocals, transcribe
  # lyrics, find the melody). CPU by default; see docker-compose.gpu.yml.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      <<: *api-env
      # Downloaded ML models are kept here, so they download only once.
      HF_HOME: /models/huggingface
      TORCH_HOME: /models/torch
    volumes:
      - ./backend:/app
      - ./config:/config:ro
      - ml_models:/models
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  web:
    build: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux) instead of your PC's.
      - web_node_modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: karaoke
      POSTGRES_PASSWORD: karaoke
      POSTGRES_DB: karaoke
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaoke"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # S3-compatible file storage (songs, recordings). The app talks plain S3,
  # so any S3 service (AWS S3, Cloudflare R2, ...) can replace it in production.
  storage:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8888:8888" # file browser
    volumes:
      - storage_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      retries: 30

  # Creates the storage bucket once, then exits.
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      sh -c "echo 's3.bucket.create -name karaoke' | weed shell -master=storage:9333 2>&1 | grep -v 'already exists' ; true"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # inbox web UI

volumes:
  pgdata:
  storage_data:
  caddy_data:
  web_node_modules:
  ml_models:
