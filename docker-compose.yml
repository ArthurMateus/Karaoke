# Start everything:   docker compose up --build
# Then open:          https://localhost:8443
# Emails (magic links) arrive at http://localhost:8025

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "8443:8443"
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

  api:
    build: ./backend
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://karaoke:karaoke@postgres:5432/karaoke
      TEST_DATABASE_URL: postgresql+psycopg://karaoke:karaoke@postgres:5432/karaoke_test
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}
      EXTRA_ORIGINS: https://localhost:8443,https://${LAN_IP:-127.0.0.1}:8443
      LIMITS_FILE: /config/limits.yaml
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-Karaoke Party <no-reply@karaoke.local>}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: karaoke
      S3_SECRET_KEY: karaoke-secret
      S3_BUCKET: karaoke
      # Docker on Windows doesn't send file-change events into containers.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux) instead of your PC's.
      - web_node_modules:/app/node_modules

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: karaoke
      POSTGRES_PASSWORD: karaoke
      POSTGRES_DB: karaoke
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karaoke"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: karaoke
      MINIO_ROOT_PASSWORD: karaoke-secret
    ports:
      - "9001:9001" # storage web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  # Creates the storage bucket once, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 karaoke karaoke-secret &&
             mc mb --ignore-existing local/karaoke"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # inbox web UI

volumes:
  pgdata:
  minio_data:
  caddy_data:
  web_node_modules:
